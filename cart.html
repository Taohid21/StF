  <!-- ==================== MINIMALIST HEADER ==================== -->
  <header class="bg-white/80 backdrop-blur-md border-b border-zinc-200/70 sticky top-0 z-30 transition-all">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <button onclick="handleBackNavigation()" class="w-9 h-9 rounded-xl border border-zinc-200 bg-white flex items-center justify-center text-zinc-700 hover:text-black hover:border-zinc-400 transition active:scale-95 shadow-sm" aria-label="Go Back">

      <div class="h-24 bg-zinc-200/70 rounded-2xl"></div>
      <div class="h-40 bg-zinc-200/70 rounded-2xl mt-6"></div>
    </div>

    <!-- Empty State -->
    <div id="cartEmptyState" class="hidden text-center py-24 bg-white rounded-3xl border border-zinc-200/80 p-8 shadow-studio max-w-sm mx-auto mt-6">
      <div class="w-14 h-14 bg-zinc-100 text-zinc-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-zinc-200/60">

      <h3 class="text-base font-extrabold text-zinc-900 mb-1">আপনার ব্যাগ খালি</h3>
      <p class="text-xs text-zinc-400 mb-6 font-medium">Your shopping bag is currently empty.</p>
      <button onclick="handleBackNavigation()" class="inline-flex items-center gap-2 bg-zinc-900 hover:bg-black text-white px-5 py-3 rounded-xl text-xs font-bold transition shadow-sm active:scale-95">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Start Shopping</span>
      </button>
    </div>

    <!-- Filled Bag Grid -->
    <div id="cartContent" class="hidden grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
      
      <!-- Items List -->
      <div class="md:col-span-7 space-y-3" id="cartItemsList"></div>

      <!-- Order Summary Card -->
      <div class="md:col-span-5 sticky top-24">
        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-zinc-200/80 shadow-studio space-y-4">
          
          <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
            <h2 class="text-sm font-extrabold text-zinc-900">অর্ডার বিবরণী</h2>
            <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider" id="summaryTotalItems">0 items</span>

            <div class="flex justify-between text-zinc-500">
              <span>Subtotal</span>

            <div class="flex justify-between text-zinc-500 items-center">
              <span>Shipping</span>
              <span class="text-[11px] font-medium text-zinc-400" id="deliveryFeeNotice">Calculated at checkout</span>

            <div id="freeDeliveryNoticeWrap" class="hidden bg-emerald-50 border border-emerald-200/60 p-2.5 rounded-xl text-[11px] font-bold text-emerald-800 flex items-center gap-1.5">

              <i data-lucide="arrow-right" class="w-4 h-4"></i>

            <button onclick="handleBackNavigation()" class="w-full bg-zinc-50 hover:bg-zinc-100 text-zinc-700 py-2.5 rounded-xl font-bold text-xs transition border border-zinc-200/70 cursor-pointer">

  <script>
    let LOGO_PLACEHOLDER = "https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg";

    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || localStorage.getItem('sf_active_shop') || 'styleforever';
    localStorage.setItem('sf_active_shop', currentShop);
    const CART_STORAGE_KEY = `cart_${currentShop}`;
    const isSubdomain = false;

    const homeShopUrl = isSubdomain ? '/' : `index.html?shop=${encodeURIComponent(currentShop)}`;
    const brandLink = document.getElementById('cartBrandLink');
    if (brandLink) brandLink.href = homeShopUrl;

    function handleBackNavigation() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = homeShopUrl;
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCX1saVzamVWerXzyKPI1_wsnzSXKU6cs4",
      authDomain: "style-forever-500b5.firebaseapp.com",
      databaseURL: "https://style-forever-500b5-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "style-forever-500b5",
      storageBucket: "style-forever-500b5.firebasestorage.app",
      messagingSenderId: "424704081651",
      appId: "1:424704081651:web:5998dbf7c5e8c03b59c186",
      measurementId: "G-SHJLKXHW9R"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ব্র্যান্ড সেটিংস ব্যাকগ্রাউন্ড সিঙ্ক
    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      let sName = 'Style Forever';
      if (s.storeName) {
        let clean = s.storeName.replace(/\s+/g, ' ').trim();
        if (clean.toLowerCase() === 'styleforever' || clean.toLowerCase() === 'style forever') {
          sName = 'Style Forever';
        } else {
          sName = clean.replace(/([a-z])([A-Z])/g, '$1 $2').trim();
        }
      }

      document.title = `Bag | ${sName}`;
      document.getElementById('cartStoreTitle').innerText = sName;

      if (s.logo) {
        LOGO_PLACEHOLDER = s.logo;
        document.getElementById('cartHeaderLogo').src = s.logo;
        document.getElementById('pageFavicon').href = s.logo;
      }
    });

    let cart = [];

    // 🔥 ০ সেকেন্ডে সুপার-ফাস্ট কার্ট লোডার
    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      
      // সাথে সাথে স্ক্রিনে কার্ট রেন্ডার (ইউজার কোনো লোডিং দেখবে না)
      document.getElementById('cartSkeleton').style.display = 'none';
      renderCart();

      // ব্যাকগ্রাউন্ডে সাইজ বা স্টক সিঙ্ক (পেজ আটকে রাখবে না)
      if (cart.length > 0) {
        // প্রথমে লোকাল ক্যাশ প্রোডাক্ট দিয়ে ভ্যারিফাই করা
        try {
          const cachedProds = JSON.parse(localStorage.getItem(`sf_prod_${currentShop}`) || '[]');
          if (Array.isArray(cachedProds) && cachedProds.length > 0) {
            const prodsMap = {};
            cachedProds.forEach(p => { if (p && p.id) prodsMap[p.id] = p; });
            applyProductUpdatesToCart(prodsMap);
          }
        } catch(e) {}

        // ব্যাকগ্রাউন্ডে ফায়ারবেজ সিঙ্ক
        db.ref(`stores/${currentShop}/products`).once('value', snap => {
          const prods = snap.val() || {};
          applyProductUpdatesToCart(prods);
        });
      }
    }

    function applyProductUpdatesToCart(prods) {
      if (!prods || Object.keys(prods).length === 0) return;
      let hasUpdates = false;

      cart.forEach(item => {
        if (item.id && prods[item.id]) {
          const p = prods[item.id];
          if (p.sizes && (!item.availableSizes || item.availableSizes.length === 0)) {
            item.availableSizes = p.sizes;
            hasUpdates = true;
          }
          if (p.colors && (!item.availableColors || item.availableColors.length === 0)) {
            item.availableColors = p.colors;
            hasUpdates = true;
          }
          if (p.colorImages) item.colorImages = p.colorImages;
          if (p.sizeStock) item.sizeStock = p.sizeStock;
          if (p.sizePrices) item.sizePrices = p.sizePrices;
          item.baseDiscountPrice = p.discountPrice;
          item.baseRegularPrice = p.regularPrice;
        }
      });

      if (hasUpdates) {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
        renderCart();
      }
    }

    // কার্ট থেকে সাইজ পরিবর্তনের সাথে সাথে স্টক ও দাম সিঙ্ক
    function updateCartItemSize(index, newSize) {
      if (!cart[index]) return;
      const item = cart[index];

      if (item.sizeStock && typeof item.sizeStock === 'object') {
        const availableStock = Number(item.sizeStock[newSize]) || 0;
        
        if (availableStock <= 0) {
          alert(`দুঃখিত, '${newSize}' সাইজটি বর্তমানে স্টকে নেই!`);
          renderCart();
          return;
        }

        if (Number(item.quantity) > availableStock) {
          item.quantity = availableStock;
          alert(`এই সাইজের সর্বোচ্চ ${availableStock} টি স্টক আছে, তাই পরিমাণ সামঞ্জস্য করা হলো।`);
        }
      }

      item.selectedSize = newSize;

      if (item.sizePrices && item.sizePrices[newSize] !== undefined) {
        const customPrice = Number(item.sizePrices[newSize]);
        if (!isNaN(customPrice) && customPrice > 0) {
          item.price = customPrice;
        }
      } else if (item.baseDiscountPrice || item.baseRegularPrice) {
        item.price = Number(item.baseDiscountPrice || item.baseRegularPrice) || item.price;
      }

      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    // কালার পরিবর্তনের সাথে সাথে ইমেজ সিঙ্ক
    function updateCartItemColor(index, newColor) {
      if (!cart[index]) return;
      const item = cart[index];
      item.selectedColor = newColor;

      if (item.colorImages && item.colorImages[newColor] && item.colorImages[newColor].length > 0) {
        item.imageUrl = item.colorImages[newColor][0];
      }

      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');
      const summaryItems = document.getElementById('summaryTotalItems');
      const clearBtn = document.getElementById('clearCartBtn');

      const totalItems = cart.reduce((acc, it) => acc + (Number(it.quantity) || 1), 0);
      if (headerCount) headerCount.innerText = totalItems;
      if (summaryItems) summaryItems.innerText = `${totalItems} item${totalItems === 1 ? '' : 's'}`;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;
      let allItemsFreeDelivery = cart.length > 0 && cart.every(it => it.isFreeDelivery);

      cart.forEach((item, index) => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        subtotal += itemPrice * itemQty;

        const el = document.createElement('div');
        el.className = "bg-white p-4 rounded-2xl border border-zinc-200/80 shadow-sm transition hover:border-zinc-300";

        el.innerHTML = `
          <div class="flex gap-3.5 items-center">
            <img 
              src="${item.imageUrl || LOGO_PLACEHOLDER}" 
              alt="${item.name}" 
              class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl bg-zinc-100 border border-zinc-200 shrink-0"
              onerror="this.src='${LOGO_PLACEHOLDER}'"
            >
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-2">
                <h4 class="text-xs sm:text-sm font-bold text-zinc-900 truncate">${item.name}</h4>
                <button onclick="removeItem(${index})" class="text-zinc-400 hover:text-zinc-900 p-1 transition shrink-0 cursor-pointer" title="Remove">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              
              <div class="flex items-baseline gap-2 mt-0.5">
                <span class="text-xs sm:text-sm font-mono font-extrabold text-[#005C4F]">BDT ${itemPrice}</span>
                ${item.regularPrice && Number(item.regularPrice) > itemPrice ? `<span class="text-[11px] text-zinc-400 line-through font-mono">BDT ${item.regularPrice}</span>` : ''}
              </div>
              
              <!-- Dynamic Size & Color Selectors -->
              <div class="flex flex-wrap items-center gap-2 mt-2">
                ${item.availableSizes && item.availableSizes.length > 0 ? `
                  <div class="flex items-center gap-1 bg-zinc-50 border border-zinc-200/90 rounded-lg px-2 py-1">
                    <span class="text-[10px] font-bold text-zinc-400 uppercase">Size:</span>
                    <select onchange="updateCartItemSize(${index}, this.value)" class="text-xs font-bold text-zinc-900 bg-transparent outline-none cursor-pointer">
                      ${item.availableSizes.map(s => {
                        const sVal = typeof s === 'object' ? s.size : s;
                        const szStock = (item.sizeStock && typeof item.sizeStock === 'object' && item.sizeStock[sVal] !== undefined) ? Number(item.sizeStock[sVal]) : null;
                        const isOut = szStock !== null && szStock <= 0;
                        return `<option value="${sVal}" ${sVal === item.selectedSize ? 'selected' : ''} ${isOut ? 'disabled class="text-zinc-400"' : ''}>${sVal} ${isOut ? '(Out)' : ''}</option>`;
                      }).join('')}
                    </select>
                  </div>
                ` : (item.selectedSize ? `<span class="bg-zinc-100 border border-zinc-200/60 px-2 py-1 rounded-lg text-zinc-800 text-[10px] font-bold uppercase tracking-wider">Size: ${item.selectedSize}</span>` : '')}

                ${item.availableColors && item.availableColors.length > 0 ? `
                  <div class="flex items-center gap-1 bg-zinc-50 border border-zinc-200/90 rounded-lg px-2 py-1">
                    <span class="text-[10px] font-bold text-zinc-400 uppercase">Color:</span>
                    <select onchange="updateCartItemColor(${index}, this.value)" class="text-xs font-bold text-zinc-900 bg-transparent outline-none cursor-pointer">
                      ${item.availableColors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                  </div>
                ` : (item.selectedColor ? `<span class="bg-zinc-100 border border-zinc-200/60 px-2 py-1 rounded-lg text-zinc-800 text-[10px] font-bold">Color: ${item.selectedColor}</span>` : '')}
              </div>

              <div class="flex items-center justify-between gap-3 mt-3 pt-2.5 border-t border-zinc-100">
                <div class="inline-flex items-center border border-zinc-200 rounded-lg bg-white p-0.5">
                  <button onclick="changeQty(${index}, -1)" class="w-6 h-6 rounded flex items-center justify-center font-bold text-xs text-zinc-600 hover:bg-zinc-100 transition active:scale-95 cursor-pointer">-</button>
                  <span class="text-xs font-bold w-7 text-center select-none text-zinc-900 font-mono">${itemQty}</span>
                  <button onclick="changeQty(${index}, 1)" class="w-6 h-6 rounded flex items-center justify-center font-bold text-xs text-zinc-600 hover:bg-zinc-100 transition active:scale-95 cursor-pointer">+</button>
                </div>
                <span class="text-xs font-mono font-extrabold text-zinc-900">BDT ${itemPrice * itemQty}</span>
              </div>
            </div>
          </div>
        `;

        list.appendChild(el);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;

      const freeDelBanner = document.getElementById('freeDeliveryNoticeWrap');
      const delNotice = document.getElementById('deliveryFeeNotice');
      if (allItemsFreeDelivery) {
        freeDelBanner.classList.remove('hidden');
        delNotice.innerHTML = `<span class="text-emerald-700 font-bold">Free</span>`;
      } else {
        freeDelBanner.classList.add('hidden');
        delNotice.innerText = `Calculated at checkout`;
      }

      if (window.lucide) lucide.createIcons();
    }

    function changeQty(index, delta) {
      const item = cart[index];
      if (!item) return;

      let maxStock = 999;

      if (item.sizeStock && item.selectedSize && typeof item.sizeStock === 'object' && item.sizeStock[item.selectedSize] !== undefined) {
        maxStock = Number(item.sizeStock[item.selectedSize]) || 0;
      } else if (item.stock !== undefined && item.stock !== null) {
        maxStock = Number(item.stock) || 999;
      }

      const currentQty = Number(item.quantity) || 1;

      if (delta > 0 && maxStock > 0 && currentQty >= maxStock) {
        alert(`সর্বোচ্চ ${maxStock} টি স্টক এভেইলেবল আছে।`);
        return;
      }

      item.quantity = currentQty + delta;
      if (item.quantity <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      cart = [];
      localStorage.removeItem(CART_STORAGE_KEY);
      renderCart();
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;

      // Meta Pixel InitiateCheckout Event Fired
      if (typeof fbq === 'function') {
        const subtotal = cart.reduce((acc, it) => acc + ((Number(it.price) || 0) * (Number(it.quantity) || 1)), 0);
        fbq('track', 'InitiateCheckout', {
          content_type: 'product',
          contents: cart.map(it => ({ id: it.id, quantity: it.quantity })),
          value: subtotal,
          currency: 'BDT'
        });
      }

      const targetUrl = isSubdomain ? 'checkout.html?fromCart=true' : `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
      window.location.href = targetUrl;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      loadCart();
    });
  </script>
</body>
</html>
